<!-- Tag Reference - copy/paste tags from here -->
<div class="tag-reference" style="font-family: monospace; font-size: 0.85em; line-height: 1.8; max-height: 400px; overflow-y: auto; padding: 1rem; background: #0d1a0d; border: 1px solid #003311; border-radius: 4px; margin: 1rem 0;">
  <strong>Available tags ({{ site.data.tags.tags | size }}):</strong><br><br>
  {% for tag in site.data.tags.tags | sort %}
    <code style="background: #0a0f0a; padding: 0.15em 0.4em; border-radius: 3px; border: 1px solid #003311; color: #00ff41; margin: 0 0.25em 0.25em 0; display: inline-block;">{{ tag }}</code>
  {% endfor %}
</div>

<p style="font-size: 0.8em; color: #00661a; margin-top: 0.5rem;">
  Copy tags from above → paste into your post front matter:<br>
  <code>tags: [Government, politics, Japan, CBDC, ...]</code>
</p>
